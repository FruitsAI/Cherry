<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Gear Body (Grey) -->
  <rect x="10" y="2" width="4" height="3" fill="#9ca3af"/> <!-- Top Tooth -->
  <rect x="10" y="19" width="4" height="3" fill="#9ca3af"/> <!-- Bottom Tooth -->
  <rect x="2" y="10" width="3" height="4" fill="#9ca3af"/> <!-- Left Tooth -->
  <rect x="19" y="10" width="3" height="4" fill="#9ca3af"/> <!-- Right Tooth -->
  
  <!-- Circle Body -->
  <rect x="5" y="8" width="14" height="8" fill="#9ca3af"/>
