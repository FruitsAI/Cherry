  <rect x="10" y="3" width="1" height="1" fill="#3b82f6"/>
  <rect x="13" y="3" width="1" height="1" fill="#3b82f6"/>
  <rect x="14" y="4" width="1" height="1" fill="#3b82f6"/>
  <rect x="15" y="5" width="1" height="1" fill="#3b82f6"/>
  <rect x="9" y="5" width="6" height="1" fill="#3b82f6"/> <!-- Fill gaps -->
